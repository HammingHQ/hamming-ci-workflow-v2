name: Hamming Run Test

on:
  workflow_call:
    inputs:
      agent_id:
        required: true
        type: string
        description: "The agent ID to test"
      phone_numbers:
        required: true
        type: string
        description: "Comma-separated phone numbers to call"
      # Mutually exclusive selection methods
      tag_ids:
        required: false
        type: string
        description: "Comma-separated tag IDs (use this OR test_case_ids)"
      test_case_ids:
        required: false
        type: string
        description: "Comma-separated test case IDs (use this OR tag_ids)"
      # Optional parameters
      timeout_seconds:
        required: false
        type: string
        default: "900"
        description: "Maximum time to wait for test completion"
      min_test_pass_rate:
        required: false
        type: string
        default: "1.0"
        description: "Minimum test case pass rate (0.0-1.0, default: 1.0 = 100%)"
      min_assertion_pass_rate:
        required: false
        type: string
        default: "1.0"
        description: "Minimum assertion pass rate (0.0-1.0, default: 1.0 = 100%)"
    secrets:
      HAMMING_API_KEY:
        required: true
        description: "Hamming API key for authentication"

jobs:
  run-test:
    runs-on: ubuntu-latest
    outputs:
      test_run_id: ${{ steps.run_test.outputs.test_run_id }}
      status: ${{ steps.check_results.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: HammingHQ/hamming-ci-workflow-v2
          path: hamming-ci-workflow-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show workspace layout
        run: |
          echo "Workspace root: $(pwd)"
          echo "Top-level entries:"
          ls -al
          echo "Contents of hamming-ci-workflow-v2/:"
          ls -al hamming-ci-workflow-v2 || echo "Directory hamming-ci-workflow-v2/ not found"

      - name: Install dependencies
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/hamming-ci-workflow-v2/requirements.txt"

      - name: Validate inputs
        run: |
          if [ -n "${{ inputs.tag_ids }}" ] && [ -n "${{ inputs.test_case_ids }}" ]; then
            echo "Error: Cannot specify both tag_ids and test_case_ids"
            exit 1
          fi
          if [ -z "${{ inputs.tag_ids }}" ] && [ -z "${{ inputs.test_case_ids }}" ]; then
            echo "Error: Must specify either tag_ids or test_case_ids"
            exit 1
          fi

      - name: Run Hamming test
        id: run_test
        env:
          HAMMING_API_KEY: ${{ secrets.HAMMING_API_KEY }}
          AGENT_ID: ${{ inputs.agent_id }}
          PHONE_NUMBERS: ${{ inputs.phone_numbers }}
          TAG_IDS: ${{ inputs.tag_ids }}
          TEST_CASE_IDS: ${{ inputs.test_case_ids }}
        run: | 
          output=$(python hamming-ci-workflow-v2/scripts/hamming_run_test.py)
          echo "test_run_id=$output" >> $GITHUB_OUTPUT
          echo "Test Run ID: $output"

      - name: Wait for test to complete
        id: wait_for_test
        env:
          HAMMING_API_KEY: ${{ secrets.HAMMING_API_KEY }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          python hamming-ci-workflow-v2/scripts/hamming_wait_test_run.py ${{ steps.run_test.outputs.test_run_id }} > results.json
          echo "Test run completed"
          cat results.json

      - name: Check test results
        id: check_results
        env:
          MIN_TEST_PASS_RATE: ${{ inputs.min_test_pass_rate }}
          MIN_ASSERTION_PASS_RATE: ${{ inputs.min_assertion_pass_rate }}
        run: |
          cat results.json | python hamming-ci-workflow-v2/scripts/hamming_check_results.py

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.run_test.outputs.test_run_id }}
          path: results.json

      - name: Comment on PR (if applicable)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.run_test.outputs.test_run_id != '' }}
        uses: actions/github-script@v7
        env:
          PASSED_TESTS: ${{ steps.check_results.outputs.passed_tests }}
          TOTAL_TESTS: ${{ steps.check_results.outputs.total_tests }}
          ASSERTION_SCORE: ${{ steps.check_results.outputs.assertion_score }}
        with:
          script: |
            const fs = require('fs');
            let results = {};
            try {
              results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            } catch (e) {} // no results.json when the wait step failed; the link falls back to the app URL
            const testRunId = '${{ steps.run_test.outputs.test_run_id }}';
            const status = '${{ steps.check_results.outcome }}';
            const { PASSED_TESTS, TOTAL_TESTS, ASSERTION_SCORE } = process.env;
            
            const [statusEmoji, statusText] =
              status === 'success' ? ['✅', 'PASSED']
              : status === 'failure' || results.summary?.status === 'FAILED' ? ['❌', 'FAILED'] // a FAILED run makes the wait step exit 1, so the check is skipped
              : ['⚠️', 'DID NOT COMPLETE'];
            const lines = [
              `## ${statusEmoji} Hamming Voice Test Results`,
              '',
              `**Test Run ID:** ${testRunId}`,
              `**Status:** ${statusText}`,
            ];
            if (TOTAL_TESTS) lines.push(`**Test cases:** ${PASSED_TESTS}/${TOTAL_TESTS} passed`);
            if (ASSERTION_SCORE) lines.push(`**Assertion score:** ${ASSERTION_SCORE}`);
            lines.push('', `[View detailed results](${results.resultsUrl || 'https://app.hamming.ai/test-runs/' + testRunId})`);
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });
